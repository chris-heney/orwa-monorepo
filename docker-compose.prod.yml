# Production topology for apps.orwa.org
#
# The server already runs jwilder/nginx-proxy + letsencrypt companion on the
# external `proxy_proxy` network, and MySQL on the external `db_db` network.
# Images are pulled from GHCR (published via `nx run <app>:docker-push`).
#
# Usage on the server (from /var/opt/admin.orwa.org):
#   docker compose -f docker-compose.prod.yml pull strapi
#   docker compose -f docker-compose.prod.yml up -d strapi

services:
  strapi:
    container_name: orwa-admin-v5
    image: ghcr.io/chris-heney/orwa-monorepo/strapi:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - VIRTUAL_HOST=admin.orwa.org
      - VIRTUAL_PORT=1337
      - LETSENCRYPT_HOST=admin.orwa.org
      - LETSENCRYPT_EMAIL=info@orwa.org
    volumes:
      - ./public/uploads:/opt/app/public/uploads
    expose:
      - 1337
    networks:
      - proxy_proxy
      - db_db

  # Frontend containers (optional — production frontends currently deploy as
  # static bundles to WP Engine; these serve the same builds under subdomains).
  member-manager:
    image: ghcr.io/chris-heney/orwa-monorepo/member-manager:latest
    restart: unless-stopped
    profiles: ["frontends"]
    environment:
      - VIRTUAL_HOST=member-manager.orwa.org
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=member-manager.orwa.org
      - LETSENCRYPT_EMAIL=info@orwa.org
    networks:
      - proxy_proxy

  grant-map:
    image: ghcr.io/chris-heney/orwa-monorepo/grant-map:latest
    restart: unless-stopped
    profiles: ["frontends"]
    environment:
      - VIRTUAL_HOST=gapp-map.orwa.org
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=gapp-map.orwa.org
      - LETSENCRYPT_EMAIL=info@orwa.org
    networks:
      - proxy_proxy

  membership-application:
    image: ghcr.io/chris-heney/orwa-monorepo/membership-application:latest
    restart: unless-stopped
    profiles: ["frontends"]
    environment:
      - VIRTUAL_HOST=membership.orwa.org
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=membership.orwa.org
      - LETSENCRYPT_EMAIL=info@orwa.org
    networks:
      - proxy_proxy

  conference-registration:
    image: ghcr.io/chris-heney/orwa-monorepo/conference-registration:latest
    restart: unless-stopped
    profiles: ["frontends"]
    environment:
      - VIRTUAL_HOST=conference.orwa.org
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=conference.orwa.org
      - LETSENCRYPT_EMAIL=info@orwa.org
    networks:
      - proxy_proxy

networks:
  proxy_proxy:
    external: true
  db_db:
    external: true
