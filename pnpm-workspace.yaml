# pnpm 9 requires this; pnpm 10 treats a missing packages list as root-only.
# This repo is a single-importer Nx tree (see pnpm-lock.yaml `importers: .`), not a multi-package workspace.
packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  cypress: true
  esbuild: true
  nx: true
  phantomjs-prebuilt: true
  puppeteer: true
  unrs-resolver: true
